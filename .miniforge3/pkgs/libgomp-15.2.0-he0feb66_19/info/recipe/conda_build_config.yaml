CI: azure
CONDA_BUILD_SYSROOT: /tmp/tmp.DREbETSDkQ/MacOSX11.0.sdk
MACOSX_SDK_VERSION: '11.0'
TARGET: x86_64-conda-linux-gnu
binutils_version: '2.45'
c_compiler: gcc
c_stdlib: sysroot
c_stdlib_version: '2.17'
channel_sources: conda-forge/label/sysroot-with-crypt,conda-forge
channel_targets: conda-forge main
cpu_optimization_target: nocona
cran_mirror: https://cran.r-project.org
cross_target_cxx_stdlib: libstdcxx
cross_target_platform: linux-64
cross_target_stdlib: sysroot
cross_target_stdlib_version: '2.17'
cxx_compiler: gxx
docker_image: quay.io/condaforge/linux-anvil-x86_64:alma9
extend_keys:
- pin_run_as_build
- ignore_build_only_deps
- extend_keys
- ignore_version
fortran_compiler: gfortran
gcc_maj_ver: '15'
gcc_version: 15.2.0
ignore_build_only_deps:
- numpy
- python
libgfortran_soname: '5'
libgomp_ver: 1.0.0
lua: '5'
numpy: '1.26'
openmp_ver: '4.5'
perl: 5.26.2
pin_run_as_build:
  python:
    max_pin: x.x
    min_pin: x.x
  r-base:
    max_pin: x.x
    min_pin: x.x
python: '3.12'
r_base: '3.5'
target_platform: linux-64
with_conda_specs: 'true'
zip_keys:
- - cross_target_stdlib_version
  - cross_target_stdlib
  - cross_target_cxx_stdlib
  - TARGET
  - cross_target_platform
- - gcc_version
  - gcc_maj_ver
  - libgfortran_soname
